<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Guess the Number</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <canvas id="confettiCanvas"></canvas>

  <main class="card">
    <h1>🎯 Guess the Number</h1>
    <p>I'm thinking of a number between <strong>1</strong> and <strong>200</strong>.</p>

    <div class="input-row">
      <input type="number" id="guessInput" min="1" max="200" placeholder="Your guess" />
      <button id="guessButton">Guess</button>
    </div>

    <p id="message" class="message">Make your first guess!</p>
    <p id="attempts">Attempts: 0</p>

    <button id="resetButton" class="reset">Play Again</button>
  </main>

  <script src="script.js"></script>
</body>
</html>
